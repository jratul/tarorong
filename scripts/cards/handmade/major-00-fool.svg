<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 372">
  <!-- 주인공: 절벽 끝에서 허공으로 발을 내딛는 바보 / 보조: 봇짐, 흰 장미, 강아지 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8ff"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
  </defs>
  <rect width="256" height="372" fill="url(#sky)"/>
  <circle cx="212" cy="58" r="30" fill="#fff7d1" opacity=".7"/>
  <circle cx="212" cy="58" r="19" fill="#ffe9a6"/>

  <!-- 아래로 떨어지는 허공 + 먼 산 -->
  <path d="M150,372 L200,316 L256,346 L256,372Z" fill="#e6dcff"/>

  <!-- 절벽 -->
  <path d="M0,262 Q80,246 156,252 Q168,255 163,272 L144,372 L0,372Z" fill="#a993e6"/>
  <path d="M0,262 Q80,246 156,252 Q168,255 165,262 Q80,254 0,272Z" fill="#8fdcb5"/>
  <path d="M150,294 l-6,24 M140,334 l-4,20" stroke="#8f78d6" stroke-width="3" stroke-linecap="round"/>

  <!-- 강아지 -->
  <g transform="translate(38,236) rotate(-14)">
    <path d="M-15,-2 q-8,-7 -4,-14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#fff"/>
    <path d="M-9,7 l-3,7 M7,7 l4,7" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="13" cy="-11" r="9.5" fill="#fff"/>
    <path d="M8,-18 q-7,4 -3,12" stroke="#c9b8ff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="16" cy="-12" r="1.8" fill="#1e1a3a"/>
    <circle cx="22.5" cy="-9" r="1.8" fill="#1e1a3a"/>
  </g>

  <!-- 막대 + 봇짐 -->
  <path d="M86,200 L50,150" stroke="#a9784f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="44" cy="140" r="21" fill="#ffe9a6" stroke="#e3c36f" stroke-width="2.5"/>
  <path d="M34,134 q10,8 20,0" stroke="#e3a96f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 바보 -->
  <ellipse cx="96" cy="254" rx="12" ry="6.5" fill="#ffb1d6"/>
  <path d="M74,254 C70,204 90,170 116,170 C142,170 162,204 158,254 Q116,262 74,254Z" fill="#ffc7e3"/>
  <path d="M77,232 Q116,243 156,232" stroke="#ffe9a6" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- 허공에 내딛은 발 -->
  <ellipse cx="170" cy="250" rx="12" ry="6.5" fill="#ffb1d6" transform="rotate(-24 170 250)"/>
  <!-- 모자 + 깃털 -->
  <path d="M88,182 Q116,134 146,184 Q116,170 88,182Z" fill="#7fd1a8"/>
  <path d="M132,158 q26,-32 46,-22 q-22,6 -38,30Z" fill="#ff7a9a"/>
  <!-- 하늘을 보는 행복한 얼굴 -->
  <path d="M100,203 q6,-7 12,0 M124,203 q6,-7 12,0" stroke="#1e1a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="94" cy="214" rx="8" ry="4.5" fill="#ff8fbf" opacity=".75"/>
  <ellipse cx="142" cy="214" rx="8" ry="4.5" fill="#ff8fbf" opacity=".75"/>
  <path d="M109,212 q9,9 18,0Z" fill="#1e1a3a"/>

  <!-- 흰 장미 -->
  <path d="M154,214 L180,184" stroke="#6cc28f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M166,200 q11,-2 12,8 q-10,1 -12,-8Z" fill="#7fd1a8"/>
  <circle cx="184" cy="178" r="11" fill="#fff" stroke="#e6dcff" stroke-width="2"/>
  <path d="M179,178 q5,-6 10,0 q-5,5 -5,0" stroke="#c9b8ff" stroke-width="2" fill="none"/>
</svg>
