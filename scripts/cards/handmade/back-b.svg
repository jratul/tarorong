<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
  <!-- B안: 밤하늘 + 트럼프처럼 위아래로 마주 보는 롱이. 180° 회전 대칭 -->
  <defs>
    <pattern id="dots" x="-12" y="-2" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.3" fill="#ffe9a6" opacity=".55"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="spark" d="M0,-9 Q1.5,-1.5 9,0 Q1.5,1.5 0,9 Q-1.5,1.5 -9,0 Q-1.5,-1.5 0,-9Z"/>
    <g id="half">
      <!-- 롱이 (시안 마스코트) -->
      <g transform="translate(150,158)">
        <path d="M-44,40 C-48,-10 -26,-42 0,-42 C26,-42 48,-10 44,40 Q0,48 -44,40Z" fill="#ffe9a6" filter="url(#glow)"/>
        <ellipse cx="-14" cy="6" rx="4.2" ry="6" fill="#1e1a3a"/>
        <ellipse cx="14" cy="6" rx="4.2" ry="6" fill="#1e1a3a"/>
        <circle cx="-12.5" cy="3.5" r="1.4" fill="#fff"/>
        <circle cx="15.5" cy="3.5" r="1.4" fill="#fff"/>
        <ellipse cx="-24" cy="20" rx="7" ry="4" fill="#ffb1d6"/>
        <ellipse cx="24" cy="20" rx="7" ry="4" fill="#ffb1d6"/>
        <path d="M-5,18 q5,5 10,0" stroke="#1e1a3a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <use href="#spark" transform="translate(26,-50) scale(1.1)" fill="#b9e6ff"/>
      </g>
      <use href="#spark" transform="translate(44,46)" fill="#ffe9a6"/>
      <use href="#spark" transform="translate(256,46)" fill="#ffe9a6"/>
      <use href="#spark" transform="translate(70,150) scale(.6)" fill="#ffc7e3"/>
      <use href="#spark" transform="translate(232,120) scale(.6)" fill="#ffc7e3"/>
    </g>
  </defs>

  <rect width="300" height="500" rx="22" fill="#2c2652"/>
  <rect x="16" y="16" width="268" height="468" rx="14" fill="url(#dots)"/>
  <rect x="10" y="10" width="280" height="480" rx="16" fill="none" stroke="#ffe9a6" stroke-width="3"/>
  <rect x="18" y="18" width="264" height="464" rx="12" fill="none" stroke="#ffe9a6" stroke-width="1.2" opacity=".6"/>

  <use href="#half"/>
  <use href="#half" transform="rotate(180 150 250)"/>

  <!-- 가운데 띠 -->
  <path d="M40,250 H118 M182,250 H260" stroke="#ffe9a6" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <circle cx="150" cy="250" r="22" fill="#1e1a3a" stroke="#ffe9a6" stroke-width="2.5"/>
  <use href="#spark" transform="translate(150,250) scale(1.4)" fill="#ffe9a6"/>
  <circle cx="34" cy="250" r="3" fill="#ffe9a6"/>
  <circle cx="266" cy="250" r="3" fill="#ffe9a6"/>
</svg>
