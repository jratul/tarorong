<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
  <!-- A안: 핑크 젤리 + 가운데 밤하늘 메달 + 위아래 졸린 초승달. 180° 회전 대칭 -->
  <defs>
    <pattern id="dots" x="-12" y="-2" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M18,12 Q19,17 24,18 Q19,19 18,24 Q17,19 12,18 Q17,17 18,12Z" fill="#ffb1d6"/>
    </pattern>
    <radialGradient id="sky">
      <stop offset="0" stop-color="#3b2f78"/>
      <stop offset="1" stop-color="#1e1a3a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="s8" d="M0,-10 L1.9,-4.6 L7.07,-7.07 L4.6,-1.9 L10,0 L4.6,1.9 L7.07,7.07 L1.9,4.6 L0,10 L-1.9,4.6 L-7.07,7.07 L-4.6,1.9 L-10,0 L-4.6,-1.9 L-7.07,-7.07 L-1.9,-4.6Z"/>
    <path id="spark" d="M0,-9 Q1.5,-1.5 9,0 Q1.5,1.5 0,9 Q-1.5,1.5 -9,0 Q-1.5,-1.5 0,-9Z"/>
    <!-- 절반 장식: 이걸 180° 돌려 한 번 더 쓴다 -->
    <g id="half">
      <!-- 졸린 초승달 (뿔이 위로) -->
      <g transform="translate(150,100)">
        <path d="M-36,-4 A36,36 0 0,0 36,-4 A36,15 0 0,1 -36,-4Z" fill="#ffe9a6" stroke="#e3b45a" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M-12,16 q4,3.5 8,0 M4,16 q4,3.5 8,0" stroke="#2c2652" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <ellipse cx="-17" cy="22" rx="4" ry="2.3" fill="#ffb1d6"/>
        <ellipse cx="17" cy="22" rx="4" ry="2.3" fill="#ffb1d6"/>
      </g>
      <use href="#spark" transform="translate(104,124) scale(.8)" fill="#fff"/>
      <use href="#spark" transform="translate(196,124) scale(.8)" fill="#fff"/>
      <!-- 모서리 -->
      <use href="#spark" transform="translate(44,46)" fill="#ffe9a6"/>
      <use href="#spark" transform="translate(256,46)" fill="#ffe9a6"/>
    </g>
  </defs>

  <rect width="300" height="500" rx="22" fill="#2c2652"/>
  <rect x="8" y="8" width="284" height="484" rx="16" fill="#ffc7e3"/>
  <rect x="8" y="8" width="284" height="484" rx="16" fill="url(#dots)"/>
  <rect x="16" y="16" width="268" height="468" rx="11" fill="none" stroke="#2c2652" stroke-width="2"/>

  <use href="#half"/>
  <use href="#half" transform="rotate(180 150 250)"/>

  <!-- 가운데 메달 -->
  <circle cx="150" cy="250" r="82" fill="#ffc7e3"/>
  <circle cx="150" cy="250" r="76" fill="url(#sky)" stroke="#ffe9a6" stroke-width="4"/>
  <circle cx="150" cy="250" r="64" fill="none" stroke="#ffe9a6" stroke-width="1.5" stroke-dasharray="2 6" stroke-linecap="round"/>
  <use href="#s8" transform="translate(150,250) scale(4.4)" fill="#ffe9a6" filter="url(#glow)"/>
  <use href="#s8" transform="translate(150,250) scale(1.8)" fill="#fff7d1"/>
  <g fill="#fff">
    <circle cx="110" cy="232" r="1.6"/><circle cx="190" cy="268" r="1.6"/>
    <circle cx="124" cy="286" r="1.3"/><circle cx="176" cy="214" r="1.3"/>
  </g>
</svg>
